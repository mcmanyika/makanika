# Firebase App Hosting — set secret values in Firebase Console → App Hosting → your backend → Environment variables
# (same keys as .env.local). Do not commit API keys or service account JSON here.

runConfig:
  minInstances: 0
  maxInstances: 10
  concurrency: 80

env:
  - variable: OPENAI_MODEL
    value: gpt-4o-mini
    availability:
      - RUNTIME
  # Set in Firebase Console → App Hosting → Environment (RUNTIME):
  # OPENAI_API_KEY, NEXT_PUBLIC_* vars
  # FIREBASE_SERVICE_ACCOUNT_JSON is optional on App Hosting (FIREBASE_CONFIG + ADC is used)
